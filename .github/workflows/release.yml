name: Release

# Publishes the version in package.json to npm. Two approvals: the `release`
# environment starts the publish job, and the npm version is only staged
# (npm stage publish) until a maintainer approves it on npmjs.com with 2FA.
# Then the job tags the version and creates the GitHub release. Every step
# skips what already exists, so a re-run after a failure finishes the release.
# The first version is published by hand: CONTRIBUTING.md (Releasing).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run — test and pack without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      distTag: ${{ steps.version.outputs.distTag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Biome
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      # A pre-release such as 0.2.0-beta.1 goes out under its label (beta).
      - name: Read the Version
        id: version
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            pre_release="${version#*-}"
            dist_tag="${pre_release%%.*}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "distTag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Version $version, npm dist-tag $dist_tag"

      - name: Pack
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          ls -l release-assets

      - name: Upload Release Assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish Release
    if: ${{ !inputs.dry-run }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write # tag and GitHub release
      id-token: write # npm trusted publishing (GitHub OIDC)
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DIST_TAG: ${{ needs.verify.outputs.distTag }}
      PACKAGE: "@leonio/kern-ux-tailwind"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Release Assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Setup Node for npm
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm Supports Staged Publishing
        run: |
          node -e '
            const version = process.argv[1];
            const [major, minor] = version.split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 15)) {
              console.error(`npm ${version} is too old: npm stage publish needs 11.15.0 or later.`);
              process.exit(1);
            }
            console.log(`npm ${version}`);
          ' "$(npm --version)"

      # The ./ matters: npm reads "release-assets/x.tgz" as a GitHub repo shorthand.
      - name: Stage on npm
        shell: bash
        run: |
          if [[ -n "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" ]]; then
            echo "$PACKAGE@$VERSION is already live on npm; skipping."
            exit 0
          fi
          tarball="$(ls ./release-assets/*.tgz)"
          if ! npm stage publish "$tarball" --provenance --access public --tag "$DIST_TAG"; then
            echo "::error::Staging $PACKAGE@$VERSION failed. If an earlier attempt already staged it, approve (or reject) it on npmjs.com, then re-run the failed job."
            exit 1
          fi
          {
            echo "## Approve the npm release"
            echo
            echo "Approve \`$PACKAGE@$VERSION\` (tag \`$DIST_TAG\`) with 2FA: npmjs.com → **Staged Packages** → **Approve**,"
            echo "or \`npm stage list $PACKAGE\` and \`npm stage approve <stage-id>\`. This job waits for it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Approval on npmjs.com
        timeout-minutes: 60
        shell: bash
        run: |
          until [[ -n "$(npm view "$PACKAGE@$VERSION" version --prefer-online 2>/dev/null)" ]]; do
            echo "Waiting for $PACKAGE@$VERSION to be approved and live on npm…"
            sleep 30
          done
          echo "$PACKAGE@$VERSION is live."

      # --target pins the tag to the released commit.
      - name: Create or Update the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            prerelease_flag=""
            if [[ "$DIST_TAG" != "latest" ]]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes \
              $prerelease_flag
          fi
